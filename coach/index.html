<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts" id="apptitle">
<meta name="theme-color" content="#0E1115">
<link rel="apple-touch-icon" href="../lifter-icon-v2.png">
<title>Workouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Client workout app. The program comes from the coach's Google Sheet; logged sets go back to it. */
:root {
  --bg: #EDEFF2; --surface: #FFFFFF; --sunk: #F4F5F7; --ink: #14181D; --muted: #5A636F; --line: #D6DBE1;
  --accent: var(--brand, #1E4FD6); --accent-ink: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
  --ok: #1F7A4D; --ok-soft: #DDF1E6; --warn: #B4410C; --bar: #14181D; --bar-ink: #FFFFFF;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1115; --surface: #161A20; --sunk: #1C2128; --ink: #E7EBF0; --muted: #98A2AF; --line: #2A313A;
    --accent: color-mix(in srgb, var(--brand, #1E4FD6) 60%, #FFFFFF); --accent-ink: #0E1115;
    --ok: #5CC28E; --ok-soft: #173326; --warn: #F08A57; --bar: #1C2128; --bar-ink: #E7EBF0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1115; --surface: #161A20; --sunk: #1C2128; --ink: #E7EBF0; --muted: #98A2AF; --line: #2A313A;
  --accent: color-mix(in srgb, var(--brand, #1E4FD6) 60%, #FFFFFF); --accent-ink: #0E1115;
  --ok: #5CC28E; --ok-soft: #173326; --warn: #F08A57; --bar: #1C2128; --bar-ink: #E7EBF0; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2, h3 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 30px; line-height: 1; }
h3 { font-size: 20px; line-height: 1.05; }
p { margin: 0; }
[hidden] { display: none !important; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

.app { max-width: 560px; margin: 0 auto; min-height: calc(100vh + 1px); padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top .t { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; margin-top: 4px; }
.top .t .td { margin-left: 10px; font-family: var(--body); font-size: 14px; font-weight: 600; text-transform: none; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.sync.warn { color: var(--warn); font-weight: 600; }
main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card.hero { border-top: 5px solid var(--accent); }
.banner { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.banner button { background: none; border: none; padding: 0 2px; color: var(--muted); font-size: 18px; line-height: 1; }
.btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 17px; background: var(--accent); color: var(--accent-ink); text-align: center; text-decoration: none; }
.btn.ghost { background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
.linkbtn { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 15px; text-align: left; }
.exlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.exlist .b { display: inline-block; min-width: 26px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.prog { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--accent); }

.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.srow-btn { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; background: none; border: none; border-top: 1px solid var(--line); padding: 14px 16px; }
.srow-btn:first-child { border-top: none; }
.srow-btn .k { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.srow-btn .n { font-weight: 700; font-size: 17px; }
.srow-btn .st { grid-row: 1 / span 2; grid-column: 2; }
.srow-btn.next { background: var(--accent-soft); }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.prog-p { background: var(--accent-soft); color: var(--accent); }
.weeks { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.weeks::-webkit-scrollbar { display: none; }
.wk { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 15px; }
.wk[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wk .d { font-size: 11px; font-weight: 600; margin-left: 6px; color: var(--ok); }

.back { align-self: flex-start; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.iname { display: flex; align-items: baseline; gap: 10px; }
.iname .b { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 7px; padding: 1px 7px; flex: none; }
.iname .n { font-weight: 700; font-size: 18px; line-height: 1.25; }
.rx { font-family: var(--mono); font-size: 13.5px; color: var(--muted); }
.cnote { font-size: 14px; background: var(--sunk); border-radius: 10px; padding: 8px 11px; }
.last { display: flex; justify-content: space-between; gap: 10px; width: 100%; background: none; border: none; padding: 0; text-align: left; font-size: 13px; color: var(--muted); }
.last .v { font-family: var(--mono); color: var(--accent); text-align: right; }
.last .chev { font-size: 10px; margin-left: 4px; display: inline-block; transition: transform .15s; }
.last[aria-expanded="true"] .chev { transform: rotate(180deg); }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hist li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 13px; align-items: baseline; }
.hist .hd { color: var(--muted); white-space: nowrap; }
.hist .hv { font-family: var(--mono); font-size: 12.5px; }

.sets { display: flex; flex-direction: column; gap: 8px; }
.shead, .srow { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; }
.shead span { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; letter-spacing: .06em; text-transform: uppercase; }
.shead span:first-child { text-align: left; }
.srow .sn { font-family: var(--mono); font-size: 17px; }
.srow input { width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); color: var(--muted); caret-color: transparent; -webkit-user-select: none; user-select: none; cursor: pointer;
  font-family: var(--mono); font-size: 19px; text-align: center; padding: 0 6px; -webkit-appearance: none; appearance: none; }
.srow input::placeholder { color: var(--muted); opacity: .6; }
.srow input:focus { outline: none; }
.srow input.on { border: 2px solid var(--accent); color: var(--ink); }
.srow.ck input { color: var(--ink); }
.wbox { position: relative; min-width: 0; }
.wbox .pct { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); pointer-events: none; }
.wbox.has-pct input { padding-left: 34px; }
.ck-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ok); background: none; display: grid; place-items: center; justify-self: end; padding: 0; color: var(--ok); }
.ck-btn svg { width: 20px; height: 20px; opacity: 0; }
.ck-btn[aria-pressed="true"] { background: var(--ok); color: var(--surface); }
.ck-btn[aria-pressed="true"] svg { opacity: 1; }
.ck-all { width: 36px; height: 36px; border-width: 1.5px; }
.ck-all svg { opacity: .55; }
textarea { width: 100%; min-height: 90px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); font: inherit; padding: 10px 12px; resize: vertical; }
.small { font-size: 14px; }
.linkbtn.center { align-self: center; text-align: center; }
.card.summary { gap: 10px; }
.donebadge { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 5px 12px 5px 8px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; animation: pop .35s ease-out; }
.donebadge svg { width: 18px; height: 18px; }
@keyframes pop { 0% { transform: scale(.85); opacity: 0; } 70% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .donebadge { animation: none; } }
.sumstats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 4px -18px 0; }
.sumstats .sst { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px 12px 18px; min-width: 0; }
.sumstats .sst + .sst { border-left: 1px solid var(--line); }
.sumstats .ssl { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sumstats .ssv { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; white-space: nowrap; }
.sumbest { padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 4px; }
.sumbest .eyebrow { color: var(--accent); }
.sbrow { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; }
.sbrow .m { font-family: var(--mono); font-size: 12.5px; color: var(--accent); white-space: nowrap; }
.sumlist { list-style: none; margin: 0; padding: 0; }
.sumlist li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sumlist li:first-child { border-top: none; }
.sumlist .n { font-weight: 600; }
.sumlist .v { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: right; }
.sumnotes { padding: 10px 12px; border-radius: 10px; background: var(--sunk); font-size: 14px; white-space: pre-wrap; }
.resetbtn { align-self: center; background: none; border: none; padding: 8px 12px; color: var(--warn); font-weight: 600; font-size: 14px; border-radius: 10px; }
.resetbtn.armed { background: var(--warn); color: #FFFFFF; }

details.lh { border-top: 1px solid var(--line); }
details.lh:first-of-type { border-top: none; }
details.lh > summary { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; list-style: none; cursor: pointer; align-items: baseline; }
details.lh > summary::-webkit-details-marker { display: none; }
details.lh > summary .n { font-weight: 700; }
details.lh > summary .n::after { content: "▾"; font-size: 11px; color: var(--muted); margin-left: 6px; display: inline-block; transition: transform .15s; }
details.lh[open] > summary .n::after { transform: rotate(180deg); }
details.lh > summary .c { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
details.lh .hist { padding-bottom: 12px; }

/* Number pad, same as the personal app: digits on the left, a big check on the right that logs the set. */
.kp { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: #1C2128; color: #E7EBF0; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.25);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); --kpa: color-mix(in srgb, var(--brand, #1E4FD6) 60%, #FFFFFF); }
.kp[hidden] { display: none; }
.kp-in { max-width: 520px; margin: 0 auto; }
.kp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kp-k { aspect-ratio: 1.35; border-radius: 999px; border: 1px solid #3A424D; background: transparent; color: #E7EBF0; font-family: var(--body); font-size: 26px; display: grid; place-items: center; padding: 0; }
.kp-k:active { background: #2A313A; }
.kp-k svg, .kp-ok svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.kp-k svg { width: 26px; height: 26px; stroke-width: 2; }
.kp-ok { grid-row: span 3; border-radius: 28px; border: none; background: var(--kpa); color: #0E1115; display: grid; place-items: center; padding: 0; }
.kp-ok svg { width: 34px; height: 34px; stroke-width: 2.6; }
.kp-ok:active { filter: brightness(.9); }
body.kp-open .app { padding-bottom: calc(var(--kph, 360px) + 40px); }
body.kp-open .rest { bottom: var(--kph, 360px); z-index: 36; }
.rest { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 6; max-width: 560px; margin: 0 auto;
  background: var(--bar); color: var(--bar-ink); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 16px 16px 0 0; }
.rest .l { font-size: 11px; letter-spacing: .12em; font-weight: 600; text-transform: uppercase; opacity: .75; }
.rest .tm { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.1; }
.rest .bt { display: flex; gap: 8px; }
.rest button { background: none; border: 1px solid currentColor; border-radius: 12px; padding: 9px 14px; font-weight: 700; color: inherit; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: none; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 8; background: var(--bar); color: var(--bar-ink);
  border-radius: 99px; padding: 10px 18px; font-weight: 600; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.foot { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="eyebrow" id="gym">Workouts</div><div class="t" id="vt">Today</div></div>
    <div class="sync" id="sync"></div>
  </header>
  <main id="view"></main>
</div>
<div class="kp" id="kp" hidden role="dialog" aria-label="Number pad">
  <div class="kp-in">
    <div class="kp-grid">
      <button class="kp-k" type="button" data-d="1">1</button><button class="kp-k" type="button" data-d="2">2</button><button class="kp-k" type="button" data-d="3">3</button><button class="kp-k" type="button" data-d="del" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button>
      <button class="kp-k" type="button" data-d="4">4</button><button class="kp-k" type="button" data-d="5">5</button><button class="kp-k" type="button" data-d="6">6</button><button class="kp-ok" type="button" id="kp-ok" aria-label="Log this set"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
      <button class="kp-k" type="button" data-d="7">7</button><button class="kp-k" type="button" data-d="8">8</button><button class="kp-k" type="button" data-d="9">9</button>
      <button class="kp-k" type="button" data-d=".">.</button><button class="kp-k" type="button" data-d="0">0</button><button class="kp-k" type="button" id="kp-close" aria-label="Close number pad"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </div>
</div>
<div class="rest" id="rest" hidden>
  <div><div class="l" id="rest-l">Rest</div><div class="tm" id="rest-t">0:00</div></div>
  <div class="bt"><button type="button" id="rest-add">+30s</button><button type="button" id="rest-skip">Skip</button></div>
</div>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Today</button>
  <button type="button" data-v="program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Program</button>
  <button type="button" data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>History</button>
</nav>
<script>
(function () {
  "use strict";
  var VERSION = "4";

  // Sample program for ?demo, so anyone can try the app without a coach's sheet.
  var DEMO_DATA = {
    ok: true,
    client: { name: "Demo Client" },
    settings: { gym: "Demo Gym", coach: "Coach" },
    maxes: { "Back squat": 275, "Bench press": 205 },
    history: [],
    program: (function () {
      var out = [], pct = ["70%", "72.5%", "75%"], dl = ["185", "195", "205"];
      for (var w = 1; w <= 3; w++) {
        out.push({ id: "w" + w + "-day-1", week: String(w), day: "Day 1", title: "Lower", items: [
          { block: "A", n: "Back squat", sets: "4", reps: "6", load: pct[w - 1], rest: "2 min", notes: "Brace before every rep. Hit depth." },
          { block: "B1", n: "Romanian deadlift", sets: "3", reps: "8", load: "135", rest: "", notes: "" },
          { block: "B2", n: "Walking lunge", sets: "3", reps: "10 each", load: "25", rest: "90s", notes: "Dumbbells in each hand." },
          { block: "C", n: "Plank", sets: "3", reps: "30 sec", load: "", rest: "45s", notes: "" } ] });
        out.push({ id: "w" + w + "-day-2", week: String(w), day: "Day 2", title: "Upper", items: [
          { block: "A", n: "Bench press", sets: "4", reps: "6", load: pct[w - 1], rest: "2 min", notes: "" },
          { block: "B1", n: "DB row", sets: "3", reps: "10", load: "50", rest: "", notes: "" },
          { block: "B2", n: "Push-up", sets: "3", reps: "AMRAP", load: "BW", rest: "90s", notes: "" } ] });
        out.push({ id: "w" + w + "-day-3", week: String(w), day: "Day 3", title: "Full body", items: [
          { block: "A", n: "Trap bar deadlift", sets: "3", reps: "5", load: dl[w - 1], rest: "2 min", notes: "" },
          { block: "B", n: "Lat pulldown", sets: "3", reps: "12/10/8", load: "100/110/120", rest: "75s", notes: "Heavier each set." } ] });
      }
      return out;
    })()
  };

  // ---------- Storage on this phone ----------
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // Link: ?k=<coach's script id>&c=<client code>. Saved so the Home Screen app keeps working without them.
  var qs = new URLSearchParams(location.search);
  var DEMO = qs.has("demo");
  var cfg = load("coach-cfg") || {};
  if (qs.get("c")) {
    cfg = { k: qs.get("k") || cfg.k || "", c: qs.get("c"), api: localApi(qs.get("api")) };

      b.appendChild(el("span", "k", s.day && s.day !== s.title ? s.day : "Week " + s.week));
      var st = isDone(s.id) ? el("span", "pill done", "Done") : isStarted(s.id) ? el("span", "pill prog-p", "Started") : el("span", "pill", "To do");
      st.classList.add("st");
      b.appendChild(st);
      b.appendChild(el("span", "n", s.title));
      b.addEventListener("click", function () { open(s.id); });
      box.appendChild(b);
    });
    return box;
  }

  function renderProgram() {
    var m = model(), nx = nextSession();
    if (pickWeek == null || m.weeks.indexOf(pickWeek) < 0) pickWeek = nx ? nx.week : m.weeks[0];
    var bar = el("div", "weeks");
    m.weeks.forEach(function (w) {
      var all = m.sessions.filter(function (s) { return s.week === w; });
      var b = el("button", "wk", "Week " + w); b.type = "button";
      b.setAttribute("aria-pressed", String(w === pickWeek));
      if (all.length && all.every(function (s) { return isDone(s.id); })) b.appendChild(el("span", "d", "✓"));
      b.addEventListener("click", function () { pickWeek = w; render(); });
      bar.appendChild(b);
    });
    viewEl.appendChild(bar);
    viewEl.appendChild(sessionRows(m.sessions.filter(function (s) { return s.week === pickWeek; }), nx));
  }

  function open(id) { sel = id; render(); window.scrollTo(0, 0); }

  // ---------- Finishing a workout ----------
  var editing = {};
  // A workout logged on another phone: copy the sheet's sets onto this one before showing or editing it,
  // so saving here never replaces the sheet's rows with an empty workout.
  function hydrate(s) {
    var rem = remote()[s.id];
    if (hasLocal(s.id) || !rem) return;
    var lg = logOf(s.id);
    s.items.forEach(function (it) {
      var rows = null;
      Object.keys(rem.ex).forEach(function (n) { if (!rows && norm(n) === norm(it.n)) rows = rem.ex[n]; });
      if (!rows) return;
      var v = itemLog(s.id, it.key);
      rows.forEach(function (x) { var i = x.set - 1; if (i < 0 || i >= it.sets) return; v.w[i] = x.w; v.r[i] = x.r; v.ck[i] = x.done; });
    });
    lg.status = rem.status || "In progress"; lg.date = rem.date || lg.date;
    if (rem.notes) lg.notes = rem.notes;
    if (rem.minutes != null) lg.minutes = rem.minutes;
    if (lg.status === "Done") lg.doneAt = (rem.date || isoDay()) + "T12:00:00";
    save(LKEY, logs);
  }
  function finishSession(s) {
    var lg = logOf(s.id), now = Date.now();
    stopRest(); KP.close();
    lg.status = "Done"; lg.doneAt = new Date(now).toISOString(); if (!lg.date) lg.date = isoDay();
    if (lg.startedAt) lg.minutes = Math.max(1, Math.min(240, Math.round((now - lg.startedAt) / 60000)));
    save(LKEY, logs); queueSync(s.id, true);
    editing[s.id] = false;
    if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  function resumeSession(s) {
    var lg = logOf(s.id);
    lg.status = "In progress"; delete lg.doneAt;
    lg.startedAt = Date.now() - (lg.minutes || 0) * 60000;
    save(LKEY, logs); queueSync(s.id, true);
    editing[s.id] = false; render(); window.scrollTo(0, 0);
  }
  // Clears every set and the time; notes stay. Two taps, so a stray one can't wipe the workout.
  function resetSession(s) {
    var lg = logOf(s.id);
    stopRest(); KP.close();
    lg.items = {}; lg.status = "In progress";
    delete lg.doneAt; delete lg.minutes; delete lg.startedAt; delete lg.date;
    save(LKEY, logs); queueSync(s.id, true);
    editing[s.id] = false; render(); window.scrollTo(0, 0);
  }
  // Heaviest checked weight for an exercise in earlier workouts (this phone or the sheet).
  function prevTop(name, id, date) {
    var key = norm(name), best = null;
    function take(w) { if (w != null && w > 0 && (best == null || w > best)) best = w; }
    Object.keys(logs).forEach(function (oid) {
      if (oid === id || !hasLocal(oid)) return;
      var s2 = model().byId[oid], lg = logs[oid];
      if (!s2 || (lg.date && date && lg.date > date)) return;
      s2.items.forEach(function (it) {
        if (norm(it.n) !== key) return;
        var v = lg.items[it.key]; if (!v) return;
        for (var i = 0; i < it.sets; i++) if (v.ck[i]) take(v.w[i]);
      });
    });
    var rem = remote();
    Object.keys(rem).forEach(function (oid) {
      if (oid === id || hasLocal(oid) || (rem[oid].date && date && rem[oid].date > date)) return;
      rem[oid].order.forEach(function (n) { if (norm(n) === key) rem[oid].ex[n].forEach(function (x) { if (x.done) take(x.w); }); });
    });
    return best;
  }
  function stats(s) {
    var lg = logOf(s.id), out = { sets: 0, vol: 0, lines: [], skipped: [], best: [] };
    s.items.forEach(function (it) {
      var v = lg.items[it.key] || { w: [], r: [], ck: [] }, done = [], top = null;
      for (var i = 0; i < it.sets; i++) {
        if (!v.ck[i]) continue;
        var r = v.r[i] != null ? v.r[i] : it.per[i].rFill, w = v.w[i];
        done.push({ w: w, r: v.r[i] });
        if (w != null && w > 0) {
          if (top == null || w > top) top = w;
          if (r && !/yd|sec|min|cal|\bm\b/i.test(it.per[i].reps || "")) out.vol += w * r;
        }
      }
      if (!done.length) { out.skipped.push(it.n); return; }
      out.sets += done.length;
      out.lines.push({ n: it.n, txt: setText(done) });
      if (top != null) {
        var prev = prevTop(it.n, s.id, lg.date);
        if (prev != null && top > prev) out.best.push({ n: it.n, txt: top + " lb, up from " + prev });
      }
    });
    return out;
  }
  function volumeLine(v) {
    var eq = [[13000, "an elephant", "elephants"], [4000, "a car", "cars"], [1000, "a grand piano", "grand pianos"]];
    for (var i = 0; i < eq.length; i++) {
      if (v < eq[i][0]) continue;
      var n = Math.round(v / eq[i][0]);
      return "That's about " + (n === 1 ? eq[i][1] : n + " " + eq[i][2]) + ".";
    }
    return "";
  }
  var DONE_LINES = [
    "Logged. Go eat something with protein in it.",
    "That's one more in the books. Hydrate.",
    "Walking normally is optional for the next hour.",
    "Nice work. Your coach will see every set.",
    "Another one down. The program works because you show up."
  ];
  function renderSummary(s) {
    var lg = logOf(s.id), st = stats(s);
    var c = el("section", "card summary");
    var badge = el("div", "donebadge"); badge.innerHTML = CHECK_SVG; badge.appendChild(document.createTextNode("Workout complete"));
    c.appendChild(badge);
    c.appendChild(el("div", "eyebrow", sessLabel(s) + (lg.date ? " · " + fmtDay(lg.date) : "")));
    c.appendChild(el("h2", null, s.title));
    c.appendChild(el("p", "muted", DONE_LINES[(s.id.length + (lg.date || "").length + s.items.length) % DONE_LINES.length]));
    var g = el("div", "sumstats");
    [["Time", lg.minutes != null ? lg.minutes + " min" : "—"], ["Sets", String(st.sets)], ["Volume", st.vol ? Math.round(st.vol).toLocaleString("en-US") + " lb" : "—"]].forEach(function (x) {
      var t = el("div", "sst"); t.appendChild(el("span", "ssl", x[0])); t.appendChild(el("span", "ssv", x[1])); g.appendChild(t);
    });
    c.appendChild(g);
    var vl = st.vol ? volumeLine(st.vol) : "";
    if (vl) c.appendChild(el("p", "muted small", vl));
    if (st.best.length) {
      var hi = el("div", "sumbest"); hi.appendChild(el("div", "eyebrow", "Heaviest yet"));
      st.best.forEach(function (b) { var r = el("div", "sbrow"); r.appendChild(el("span", null, b.n)); r.appendChild(el("span", "m", b.txt)); hi.appendChild(r); });
      c.appendChild(hi);
    }
    var ul = el("ul", "sumlist");
    st.lines.forEach(function (x) { var li = el("li"); li.appendChild(el("span", "n", x.n)); li.appendChild(el("span", "v", x.txt)); ul.appendChild(li); });
    c.appendChild(ul);
    if (st.skipped.length) c.appendChild(el("p", "muted small", "Skipped: " + st.skipped.join(", ")));
    if (lg.notes && String(lg.notes).trim()) c.appendChild(el("p", "sumnotes", String(lg.notes).trim()));
    viewEl.appendChild(c);
    var eb = el("button", "btn ghost", "Edit workout"); eb.type = "button";
    eb.addEventListener("click", function () { editing[s.id] = true; render(); window.scrollTo(0, 0); });
    viewEl.appendChild(eb);
    var rb = el("button", "linkbtn center", "Finished by mistake? Resume workout"); rb.type = "button";
    rb.addEventListener("click", function () { resumeSession(s); });
    viewEl.appendChild(rb);
  }

  function renderSession(s) {
    hydrate(s);
    var lg = logOf(s.id);
    var back = el("button", "linkbtn back", "‹ Back"); back.type = "button";
    back.addEventListener("click", function () { sel = null; render(); window.scrollTo(0, 0); });
    viewEl.appendChild(back);
    if (isDone(s.id) && !editing[s.id]) return renderSummary(s);
    var head = el("div");
    head.appendChild(el("div", "eyebrow", sessLabel(s) + (isDone(s.id) ? " · Done" : "")));
    head.appendChild(el("h2", null, s.title));
    viewEl.appendChild(head);
    s.items.forEach(function (it) { viewEl.appendChild(renderItem(s, it)); });

    var nc = el("section", "card");
    nc.appendChild(el("div", "eyebrow", "Notes for " + coachName()));
    var ta = el("textarea"); ta.placeholder = "How it felt, anything to change…"; ta.value = lg.notes || "";
    ta.addEventListener("input", function () { lg.notes = ta.value; save(LKEY, logs); });
    ta.addEventListener("change", function () { if (lg.status || lg.date) queueSync(s.id); });
    nc.appendChild(ta);
    viewEl.appendChild(nc);

    var fin = el("button", "btn", isDone(s.id) ? "Done editing" : "Finish workout"); fin.type = "button";
    fin.addEventListener("click", function () {
      if (isDone(s.id)) { queueSync(s.id, true); editing[s.id] = false; render(); window.scrollTo(0, 0); return; }
      finishSession(s);
    });
    viewEl.appendChild(fin);
    if (isDone(s.id)) {
      var rz = el("button", "resetbtn", "Reset workout"); rz.type = "button";
      var armed = null;
      rz.addEventListener("click", function () {
        if (!armed) {
          rz.textContent = "Tap again to clear every set"; rz.classList.add("armed");
          armed = setTimeout(function () { armed = null; rz.textContent = "Reset workout"; rz.classList.remove("armed"); }, 4000);
          return;
        }
        clearTimeout(armed); resetSession(s);
      });
      viewEl.appendChild(rz);
    }
  }

  function renderItem(s, it) {
    var box = el("section", "item");
    var nm = el("div", "iname");
    if (it.block) nm.appendChild(el("span", "b", it.block));
    nm.appendChild(el("span", "n", it.n));
    box.appendChild(nm);
    box.appendChild(el("div", "rx", it.rx));
    if (it.notes) box.appendChild(el("div", "cnote", it.notes));

    var past = historyOf(it.n, s.id);
    if (past.length) {
      var lb = el("button", "last"); lb.type = "button"; lb.setAttribute("aria-expanded", "false");
      var l1 = el("span", null, "Last time"); l1.appendChild(el("span", "chev", "▾"));
      lb.appendChild(l1); lb.appendChild(el("span", "v", past[0].txt));
      var hl = histList(past, it.n); hl.hidden = true;
      lb.addEventListener("click", function () { hl.hidden = !hl.hidden; lb.setAttribute("aria-expanded", String(!hl.hidden)); });
      box.appendChild(lb); box.appendChild(hl);
    }

    var v = itemLog(s.id, it.key);
    var wrap = el("div", "sets");
    var sh = el("div", "shead");
    sh.appendChild(el("span", null, "Set")); sh.appendChild(el("span", null, "Reps")); sh.appendChild(el("span", null, "Lb"));
    var all = el("button", "ck-btn ck-all"); all.type = "button"; all.innerHTML = CHECK2_SVG; all.setAttribute("aria-label", "Check every set");
    var allCell = el("span"); allCell.style.textAlign = "right"; allCell.appendChild(all); sh.appendChild(allCell);
    wrap.appendChild(sh);
    var rows = [], R_ = [], W_ = [], C_ = [];
    function num(x) { var n = parseFloat(String(x).replace(",", ".")); return isNaN(n) ? null : n; }
    function paint(i) {
      rows[i].classList.toggle("ck", !!v.ck[i]);
      C_[i].setAttribute("aria-pressed", String(!!v.ck[i]));
    }
    function setCheck(i, on) {
      v.ck[i] = on;
      if (on) {
        if (v.r[i] == null && it.per[i].rFill != null) { v.r[i] = it.per[i].rFill; R_[i].value = v.r[i]; }
        if (v.w[i] == null && it.per[i].w != null) { v.w[i] = it.per[i].w; W_[i].value = v.w[i]; }
        if (!lg().date) lg().date = isoDay();
        if (!lg().startedAt) lg().startedAt = Date.now();
        if (lg().status !== "Done") lg().status = "In progress";
      }
      paint(i);
    }
    function lg() { return logOf(s.id); }
    function padCfg(i, inp, f) {
      return {
        onInput: function () { v[f][i] = num(inp.value); save(LKEY, logs); if (v.ck[i]) queueSync(s.id); },
        onLog: function () { if (!v.ck[i]) { setCheck(i, true); changed(true, i); } else changed(false, i); }
      };
    }
    function changed(startTimer, i) {
      save(LKEY, logs); queueSync(s.id);
      if (startTimer && it.rest) startRest(it.rest, it.n);
    }
    for (var i = 0; i < it.sets; i++) (function (i) {
      var p = it.per[i];
      var row = el("div", "srow");
      row.appendChild(el("span", "sn", String(i + 1)));
      var r = el("input"); r.type = "text"; r.readOnly = true; r.inputMode = "none"; r.autocomplete = "off";
      r.placeholder = p.reps && p.reps.length <= 7 ? p.reps : (p.rFill != null ? String(p.rFill) : "");
      r.setAttribute("aria-label", "Set " + (i + 1) + " reps");
      if (v.r[i] != null) r.value = v.r[i];
      r.addEventListener("click", function () { KP.open(r, padCfg(i, r, "r")); });
      var wb = el("div", "wbox");
      if (p.pct != null) { wb.classList.add("has-pct"); wb.appendChild(el("span", "pct", p.pct + "%")); }
      var w = el("input"); w.type = "text"; w.readOnly = true; w.inputMode = "none"; w.autocomplete = "off";
      w.placeholder = p.w != null ? String(p.w) : (p.text && p.text.length <= 6 ? p.text : "");
      w.setAttribute("aria-label", "Set " + (i + 1) + " weight in pounds");
      if (v.w[i] != null) w.value = v.w[i];
      w.addEventListener("click", function () { KP.open(w, padCfg(i, w, "w")); });
      wb.appendChild(w);
      var c = el("button", "ck-btn"); c.type = "button"; c.innerHTML = CHECK_SVG; c.setAttribute("aria-label", "Set " + (i + 1) + " done");
      c.addEventListener("click", function () { setCheck(i, !v.ck[i]); changed(v.ck[i], i); });
      row.appendChild(r); row.appendChild(wb); row.appendChild(c);
      rows.push(row); R_.push(r); W_.push(w); C_.push(c);
      wrap.appendChild(row);
      paint(i);
    })(i);
    all.addEventListener("click", function () {
      var on = !rows.every(function (_, i) { return v.ck[i]; });
      rows.forEach(function (_, i) { setCheck(i, on); });
      changed(false);
    });
    box.appendChild(wrap);
    return box;
  }

  function renderHistory() {
    var names = [], seenN = {};
    function add(n) { var k = norm(n); if (k && !seenN[k]) { seenN[k] = 1; names.push(n); } }
    model().sessions.forEach(function (s) { s.items.forEach(function (it) { add(it.n); }); });
    Object.keys(remote()).forEach(function (id) { remote()[id].order.forEach(add); });
    var groups = names.map(function (n) { return { n: n, list: historyOf(n) }; }).filter(function (g) { return g.list.length; });
    var c = el("section", "card");
    if (!groups.length) {
      c.appendChild(el("p", "muted", "Your lifts show up here after your first workout."));
      viewEl.appendChild(c); return;
    }
    groups.sort(function (a, b) { return String(b.list[0].date).localeCompare(String(a.list[0].date)) || a.n.localeCompare(b.n); });
    c.appendChild(el("p", "muted", "Tap a lift to see every session."));
    groups.forEach(function (g) {
      var d = el("details", "lh"), sm = el("summary");
      sm.appendChild(el("span", "n", g.n));
      sm.appendChild(el("span", "c", g.list.length + (g.list.length === 1 ? " session" : " sessions") + (g.list[0].date ? " · " + fmtDay(g.list[0].date).replace(/^\w+, /, "") : "")));
      d.appendChild(sm); d.appendChild(histList(g.list, g.n));
      c.appendChild(d);
    });
    viewEl.appendChild(c);
    viewEl.appendChild(el("div", "foot", (data.client && data.client.name ? data.client.name + " · " : "") + "v" + VERSION));
  }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { view = b.dataset.v; sel = null; render(); window.scrollTo(0, 0); });
  });
  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { flush(); } });

  window.CoachApp = { rowsFor: rowsFor, model: model, logs: function () { return logs; }, queue: function () { return queue; } };
  brand();
  setSync("");
  render();
  refresh();
  flush();
})();
</script>
</body>
</html>
