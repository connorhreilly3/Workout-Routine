<style>
/* Layout: phone app shell. Sticky header, one scrolling view, fixed rest-timer bar above a fixed 4-tab bar. */

  // ---------- Logging (shared db) ----------
  function currentLog(id) { return drafts[id] || logs[id] || {}; }
  var timers = {}, inflight = {}, queued = {};
  function editLog(id, fn, now) {

    fn(base);

  function updateSave() {
    if (saveText && STATE_MSGS.indexOf(saveText) < 0) return setSave(saveText);
    if (dbState === "loading") setSave("Loading…");
    else if (dbState === "none") setSave("Sign in to save");
    else if (dbState === "slow") setSave("Offline");
    else setSave("");
  }

  function syncToday() {
    // Refresh the open session from the store without disturbing the field being typed in.
    if (view !== "today") return;
    var pick = sel || nowPick, id = idOf(pick);
    if (drafts[id]) return;
    var cur = logs[id] || {}, items = cur.items || {}, checks = cur.checks || {};
    var card = document.getElementById("session");
    if (!card) return;
    Array.prototype.forEach.call(card.querySelectorAll("input[data-k]"), function (inp) {
      if (inp === document.activeElement) return;
      var it = items[inp.getAttribute("data-k")] || {}, f = inp.getAttribute("data-f");
      var v = (f === "sets" || f === "reps") ? (it[f] || [])[+inp.getAttribute("data-i")] : it[f];
      inp.value = v == null ? "" : v;
    });
    Array.prototype.forEach.call(card.querySelectorAll("[data-ck]"), function (b) {
      var parts = b.getAttribute("data-ck").split(":");
      b.setAttribute("aria-pressed", String(!!((checks[parts[0]] || [])[+parts[1]])));
    });
    var ta = document.getElementById("notes-" + id);
    if (ta && ta !== document.activeElement) ta.value = cur.notes || "";
    var fb = document.getElementById("done-" + id);
    if (fb) { fb.setAttribute("aria-pressed", String(!!cur.done)); fb.textContent = cur.done ? "Session done ✓" : "Finish session"; }
  }

  // ---------- Sheet rows (used by the sync below) ----------
  // BLOCK names this program in the Sheet. Give each new program its own name.
  var BLOCK = "Pre-Trek";
  function sheetRows(id, lg) {
    lg = lg || {};
    var s = sessDef(id); if (!s || !s.blocks) s = { blocks: [] };
    var p = id.match(/^w(\d+)-l(\d+)$/), ex = p ? null : extraById(id);
    var week = p ? +p[1] : "", lift = p ? +p[2] : "Extra";
    var date = lg.done && lg.doneAt ? etDate(lg.doneAt) : (p ? iso(liftDate(week, lift)) : (ex ? ex.date : (lg.doneAt ? etDate(lg.doneAt) : "")));
    var title = p ? (s.travel ? (s.title || "Travel session") : LIFT_META[lift].title) : (ex ? ex.title : id);
    var items = lg.items || {}, checks = lg.checks || {}, fin = [], sets = [];
    function at(a, i) { return a && i < a.length && a[i] != null ? a[i] : null; }
    s.blocks.forEach(function (b) {
      b.items.forEach(function (it) {
        var v = items[it.k] || {}, ck = checks[it.k] || [];
        if (it.log === "score") { if (v.s != null && v.s !== "") fin.push(it.n + ": " + v.s); return; }
        if (it.main && it.sets) {
          expandSets(it).forEach(function (st, i) {
            var w = at(v.sets, i), r = at(v.reps, i), done = !!ck[i];
            if (w == null && r == null && !done) return;
            sets.push([BLOCK, id, date, week, lift, it.n, i + 1, st.r + " @ " + st.p + "%" + (st.bo ? " back-off" : ""), w, r, !!at(v.miss, i), done]);
          });
          return;
        }
        var n = Math.max(ck.length, (v.reps || []).length, (v.sets || []).length);
        if (!n && v.w != null) n = 1;
        var any = ck.some(Boolean);
        for (var i = 0; i < n; i++) {
          // Per-set weights when the exercise logs them; otherwise its one weight applies to every set.
          var sw = at(v.sets, i), w = Array.isArray(v.sets) ? sw : (v.w != null ? v.w : null), r = at(v.reps, i), done = !!ck[i];
          if (!(done || r != null || sw != null || (w != null && any))) continue;
          sets.push([BLOCK, id, date, week, lift, it.n, i + 1, it.rx || "", w, r, !!at(v.miss, i), done]);
        }
      });
    });
    var row = [BLOCK, id, date, week, lift, title, lg.done ? "Done" : "In progress", lg.minutes != null ? lg.minutes : "", fin.join("; "), String(lg.notes || "").trim(), lg.updatedAt || ""];
    return { block: BLOCK, id: id, row: row, sets: sets };
  }
  function bodyweightRow(id, b) {
    b = b || {};
    var week = b.week != null ? b.week : +String(id).replace(/\D/g, "");
    return { block: BLOCK, week: week, row: [BLOCK, week, b.updatedAt ? etDate(b.updatedAt) : "", b.lb != null ? b.lb : ""] };
  }
  window.WR = { block: BLOCK, rows: sheetRows, bodyweightRow: bodyweightRow };

  render();
  if (running) tickElapsed();

  var slowTimer = setTimeout(function () { if (dbState === "loading") { dbState = "slow"; saveText = ""; updateSave(); } }, 10000);
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (d) {
      clearTimeout(slowTimer);
      if (!d) { dbState = "none"; saveText = ""; updateSave(); return; }
      db = d;
      db.collection("logs").onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (doc) { next[doc.id] = doc.data(); });
        logs = next;
        if (!snap.metadata.fromCache && dbState !== "ready") { dbState = "ready"; updateSave(); }
        var a = document.activeElement, typing = a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
        if (view === "today" && firstLogs && !typing) { firstLogs = false; render(); }
        else if (view === "today") syncToday(); else if (view === "log" || (view === "week" && !KP.isOpen() && document.activeElement && document.activeElement.id !== "bw-input")) render();
      }, function () { dbState = "none"; saveText = ""; updateSave(); });
      db.collection("bodyweight").onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (doc) { next[doc.id] = doc.data(); });
        bodyweight = next;
        if (view === "log" || (view === "week" && !KP.isOpen() && (!document.activeElement || document.activeElement.id !== "bw-input"))) render();
      }, function () {});
    }, function () { clearTimeout(slowTimer); dbState = "none"; saveText = ""; updateSave(); });
  } else {
    clearTimeout(slowTimer); dbState = "none"; updateSave();
  }
})();
</script>
<script>
/* Sheet sync: sends each saved entry to the Workout Routine Google Sheet a couple of seconds after it's saved.
   Everything is saved on this phone first. Anything that can't send waits here and retries. */
(function () {
  "use strict";
  var SYNC_URL = "https://script.google.com/macros/s/AKfycbzNRNvmgsXimHRz-8bfrjcmK2rNrKYJJGmi3OR1NpYIQXQUpYWI0JJv0b2EXGh34B1o/exec"; // Google Apps Script web app address
  var DB = "ptb-db-v1", PASS = "wr-sync-pass", PEND = "wr-sync-pending", INIT = "wr-sync-init", LAST = "wr-sync-last";
  function get(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function put(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var pending = get(PEND) || {}, busy = false, again = false, timer = null, state = "";
  function stampOf() { return Date.now() + Math.random(); }

  // First run: queue everything already on this phone, so earlier sessions reach the Sheet too.
  if (!get(INIT)) {
    var d0 = get(DB) || {};
    Object.keys(d0.logs || {}).forEach(function (id) { pending["logs/" + id] = stampOf(); });
    Object.keys(d0.bodyweight || {}).forEach(function (id) { pending["bodyweight/" + id] = stampOf(); });
    put(PEND, pending); put(INIT, true);
  }

  function count() { return Object.keys(pending).length; }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(flush, ms); }
  function mark(col, id) {
    if (col !== "logs" && col !== "bodyweight") return;
    pending[col + "/" + id] = stampOf();
    put(PEND, pending);
    show();
    schedule(2000);
  }

  function flush() {
    clearTimeout(timer); timer = null;
    if (!SYNC_URL || !count() || !window.WR) return show();
    var pass = get(PASS);
    if (!pass) return show();
    if (busy) { again = true; return; }
    var d = get(DB) || {}, sent = {}, body = { passcode: pass, sessions: [], bodyweight: [] };
    Object.keys(pending).forEach(function (k) {
      var i = k.indexOf("/"), col = k.slice(0, i), id = k.slice(i + 1), doc = (d[col] || {})[id];
      sent[k] = pending[k];
      if (!doc) return;
      try {
        if (col === "logs") body.sessions.push(window.WR.rows(id, doc));
        else body.bodyweight.push(window.WR.bodyweightRow(id, doc));
      } catch (e) {}
    });
    body.sessions.sort(function (a, b) { return String(a.row[2]).localeCompare(String(b.row[2])) || String(a.id).localeCompare(String(b.id)); });
    busy = true; state = "busy"; show();
    fetch(SYNC_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        busy = false;
        if (res && res.ok) {
          Object.keys(sent).forEach(function (k) { if (pending[k] === sent[k]) delete pending[k]; });
          put(PEND, pending); put(LAST, new Date().toISOString());
          state = "";
        } else if (res && res.error === "passcode") {
          put(PASS, null); state = "badpass"; again = false;
          openDlg("That passcode didn't match the sync script. Check it and try again.");
        } else {
          state = "error";
        }
        show();
        if (again) { again = false; schedule(300); }
      }, function () {
        busy = false; state = navigator.onLine === false ? "offline" : "error"; show();
        if (again) { again = false; }
      });
  }

  // Header status
  var btn = document.getElementById("sync");
  function show() {
    if (!btn) return;
    if (!SYNC_URL) { btn.hidden = true; return; }
    btn.hidden = false;
    // Silent when syncing normally; only problems show.
    var n = count(), pass = get(PASS), t = "";
    if (!pass) t = state === "badpass" ? "Wrong passcode · tap to fix" : "Connect Sheet";
    else if (n && !busy && (state === "offline" || state === "error")) t = "Not syncing · tap to retry";
    btn.hidden = !t;
    btn.textContent = t;
    btn.className = "syncbtn warn";
  }
  if (btn) btn.addEventListener("click", function () {
    if (!get(PASS)) openDlg(); else flush();
  });

  // Passcode dialog
  var dlg = document.getElementById("syncdlg"), inp = document.getElementById("syncdlg-pass"), msg = document.getElementById("syncdlg-msg");
  var MSG = msg ? msg.textContent : "";
  function openDlg(err) {
    if (!dlg) return;
    msg.textContent = err || MSG; msg.className = err ? "err" : "muted";
    inp.value = ""; dlg.hidden = false;
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
  }
  function closeDlg() { if (dlg) dlg.hidden = true; }
  if (dlg) {
    document.getElementById("syncdlg-cancel").addEventListener("click", closeDlg);
    document.getElementById("syncdlg-save").addEventListener("click", function () {
      var v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      put(PASS, v); state = ""; closeDlg(); show(); flush();
    });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("syncdlg-save").click(); });
  }

  // Retry when the phone comes back online or the app is reopened.
  window.addEventListener("online", function () { schedule(500); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") schedule(500); });
  window.addEventListener("pageshow", function () { schedule(800); });
  setInterval(function () { if (count() && !busy && document.visibilityState === "visible") flush(); }, 60000);

  window.WRSync = { mark: mark, flush: flush };
  show();
  schedule(1500);
})();
</script>
